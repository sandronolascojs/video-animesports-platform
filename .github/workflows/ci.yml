# CI/CD — ONE pipeline for both gating and deploy. Adapted from plugsy-ai's ci.yml
# for this repo: Bun + Turborepo, base branch is `development` (there is no `main`).
#
#   checks (lint · typecheck · test · build, matrix) ─▶ [push to development only] ─▶ deploy (dev)
#
# Triggers:
#   • pull_request → development : runs `checks` only. Blocks the merge when red
#     (enforce via Settings → Branches → require the "checks" status check).
#   • push → development          : runs the SAME `checks` first, then `deploy` —
#       Drizzle migration against the dev Postgres, then `alchemy deploy --stage dev`.
#   • any other branch            : nothing runs.
#
# Dropped vs plugsy-ai's template (see .github/workflows/README.md for why):
#   • No Stripe anything (this app has no billing).
#   • No AI evals job/workflow (packages/ai/evals is a dev-only harness, not a CI gate).
#   • No self-hosted runners, no `changes` paths-filter, no separate Neon db-tests /
#     Playwright e2e / dependency-audit jobs, no production stage (this repo only has
#     a `dev` alchemy stage — see packages/infra/alchemy.run.ts `Stage = "dev" | "prod"`,
#     only "dev" is wired to CI/secrets here).
#
# Secrets: sourced from the GitHub Environment `development` (already provisioned).
# See .github/workflows/README.md for the full list and what each one is for.

name: CI

on:
  pull_request:
    branches:
      - development
  push:
    branches:
      - development

# Cancel superseded PR runs; NEVER cancel an in-flight deploy (push).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.13"
  TURBO_TELEMETRY_DISABLED: "1"
  CI: "true"
  # apps/web imports `@video-platform-challenge/env/web` (t3-oss/env-nextjs) at
  # next.config.ts module scope, which throws at build time if NEXT_PUBLIC_SERVER_URL
  # isn't a valid URL. CI only needs `next build` to succeed structurally — the real
  # runtime value is injected by alchemy's Worker binding at deploy time — so skip
  # strict validation and feed a placeholder URL for the Lint/Typecheck/Test/Build matrix.
  SKIP_ENV_VALIDATION: "1"
  NEXT_PUBLIC_SERVER_URL: "http://localhost:3000"

jobs:
  # ── Gate: lint, typecheck, test, build — in parallel, on every PR + push ───────────
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Lint (Biome)", run: "bunx biome check ." }
          - { name: "Typecheck", run: "bun run check-types" }
          - { name: "Test", run: "bun run test" }
          - { name: "Build", run: "bun run build" }
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ./.github/actions/setup
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: ${{ matrix.run }}

  # ════════════════════════════════════════════════════════════════════════════════
  # DEPLOY — runs ONLY on push to `development`, and ONLY after `checks` is green.
  # Single job: Drizzle migrate against the dev Postgres, then `alchemy deploy --stage dev`.
  # ════════════════════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy (dev)
    needs: [checks]
    if: ${{ github.ref == 'refs/heads/development' && success() }}
    runs-on: ubuntu-latest # GitHub-hosted ubuntu runners ship Docker preinstalled —
    # required because `alchemy deploy` builds the media-ops Cloudflare Container
    # image from containers/media-ops/Dockerfile.
    environment: development
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ./.github/actions/setup
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Docker available (media-ops container build)
        run: docker version
      - name: Drizzle migrate (Postgres)
        run: bun run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Alchemy deploy (stage dev)
        run: bun run --filter @video-platform-challenge/infra deploy:dev:ci
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Persistent alchemy state in CI (see alchemy.run.ts): the state-service
          # worker token + the password that encrypts alchemy.secret() bindings.
          ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
          ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          KIE_API_KEY: ${{ secrets.KIE_API_KEY }}
          KIE_WEBHOOK_SECRET: ${{ secrets.KIE_WEBHOOK_SECRET }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          # Shared secret injected into the media-ops Container (alchemy.run.ts).
          MEDIA_OPS_SECRET: ${{ secrets.MEDIA_OPS_SECRET }}
